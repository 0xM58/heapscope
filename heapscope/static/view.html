<h2 class="sr-only">Heap viewer: a proportional map of glibc heap chunks, tcache bins, and a diff against the previous snapshot</h2>
<style>
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  body{margin:0;font-family:var(--font-sans);font-size:13px;color:var(--color-text-primary);background:var(--color-background-tertiary)}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 22px 48px}
  .mono{font-family:var(--font-mono)}
  .muted{color:var(--color-text-secondary)}
  .faint{color:var(--color-text-tertiary)}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:0.5px solid var(--color-border-tertiary)}
  .head h1{font-size:15px;font-weight:500;margin:0}
  .head .meta{display:flex;gap:16px;font-size:12px;color:var(--color-text-secondary)}
  .scrub{display:flex;align-items:center;gap:7px;margin:16px 0 18px;flex-wrap:wrap}
  .pill{min-width:27px;height:27px;padding:0 7px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);font-size:12px;cursor:pointer;font-family:var(--font-sans)}
  .pill.on{background:var(--color-background-info);border-color:var(--color-border-info);color:var(--color-text-info);font-weight:500}
  .cols{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:22px}
  .panel{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px 16px}
  .panel h2{font-size:12px;font-weight:500;margin:0 0 12px;color:var(--color-text-secondary)}
  .rows{display:grid;grid-template-columns:104px 60px minmax(0,1fr) 74px;gap:5px 9px;align-items:center}
  .rows .lbl{font-size:11px;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rows .sz{font-size:11px;font-family:var(--font-mono);color:var(--color-text-secondary);text-align:right}
  .rows .st{font-size:10px;text-align:right;white-space:nowrap}
  .bar{height:22px;border-radius:4px;min-width:3px}
  .bar.chg{box-shadow:inset 0 0 0 1.5px var(--color-text-primary)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;font-size:11px;color:var(--color-text-secondary)}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:4px}
  .tcg{display:grid;grid-template-columns:32px 46px minmax(0,1fr) 30px;gap:6px 8px;align-items:center;font-family:var(--font-mono);font-size:11px}
  .tbar{height:7px;border-radius:4px;background:#F1EFE8;border:0.5px solid #D3D1C7;position:relative;overflow:hidden}
  .tbar > i{display:block;height:100%;background:#F09595}
  .kv{font-family:var(--font-mono);font-size:11px;color:var(--color-text-secondary);line-height:1.75}
  .chip{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;margin:0 5px 5px 0}
  .diff{margin-top:20px}
  .dgrid{display:grid;grid-template-columns:88px minmax(0,1fr);gap:5px 12px;font-family:var(--font-mono);font-size:11.5px;align-items:baseline}
  .empty{padding:34px 4px;color:var(--color-text-secondary);line-height:1.7}
  .empty code{font-family:var(--font-mono);background:var(--color-background-secondary);padding:2px 6px;border-radius:4px;font-size:12px}
  .note{margin-top:14px;font-size:11.5px;color:var(--color-text-tertiary);line-height:1.6}
</style>

<div class="wrap">
  <div class="head">
    <h1>heapscope view</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="scrub" id="scrub"></div>
  <div id="body"></div>
</div>

<script>
const S = {
  tcache:  { fill: "#FCEBEB", edge: "#F09595", text: "#791F1F" },
  unsorted:{ fill: "#FAEEDA", edge: "#EF9F27", text: "#633806" },
  live:    { fill: "#E1F5EE", edge: "#5DCAA5", text: "#085041" },
  struct:  { fill: "#E6F1FB", edge: "#85B7EB", text: "#0C447C" },
  top:     { fill: "#F1EFE8", edge: "#B4B2A9", text: "#5F5E5A" }
};

let DATA = null, INDEX = 0, SCALE = "linear";

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = s => (s === null || s === undefined) ? 0 : parseInt(s, 16);
const show = s => (s === null || s === undefined) ? "n/a" : s;

function barWidth(size, maxSize, isTop) {
  if (isTop) return 46;
  if (SCALE === "sqrt") return Math.max(3, Math.round(Math.sqrt(size) / (Math.sqrt(maxSize) || 1) * 100));
  return Math.max(3, Math.round(size / maxSize * 100));
}

function bar(pal, width, changed) {
  return '<div class="bar' + (changed ? " chg" : "") + '" style="width:' + width + "%;background:"
       + pal.fill + ";border:0.5px solid " + pal.edge + '"></div>';
}

function renderMap(snap, diff) {
  const changed = new Set();
  if (diff) {
    diff.added.forEach(a => changed.add(a));
    diff.changed.forEach(c => changed.add(c[0]));
  }

  const maxSize = Math.max(1, ...snap.chunks.filter(c => !c.is_top).map(c => num(c.size)));

  let rows = "";
  const firstHeader = snap.chunks.length ? num(snap.chunks[0].header) : num(snap.base);
  const structSize = firstHeader - num(snap.base);
  if (structSize > 0) {
    rows += '<div class="lbl">tcache struct</div>'
         +  '<div class="sz">' + "0x" + structSize.toString(16) + "</div>"
         +  bar(S.struct, barWidth(structSize, maxSize, false), false)
         +  '<div class="st" style="color:' + S.struct.text + '">struct</div>';
  }

  for (const c of snap.chunks) {
    const pal = S[c.state] || S.live;
    const label = c.state === "top" ? "top" : c.header;
    rows += '<div class="lbl mono" title="' + esc(c.header) + '">' + esc(label) + "</div>"
         +  '<div class="sz">' + esc(c.size) + "</div>"
         +  bar(pal, barWidth(num(c.size), maxSize, c.is_top), changed.has(c.header))
         +  '<div class="st" style="color:' + pal.text + '">' + (c.state === "top" ? "rest" : c.state) + "</div>";
  }

  const legend = [["live", "allocated"], ["tcache", "in tcache"], ["unsorted", "unsorted bin"], ["struct", "tcache struct"], ["top", "top"]]
    .map(([k, t]) => '<span><span class="sw" style="background:' + S[k].fill + ";border:0.5px solid " + S[k].edge + '"></span>' + t + "</span>").join("");

  return '<div class="panel"><h2>heap map at ' + esc(snap.base) + " &nbsp; " + snap.chunks.length + " chunks</h2>"
       + '<div class="rows">' + rows + "</div>"
       + '<div class="legend">' + legend + "</div>"
       + '<div class="note">Bar width is relative to the largest chunk. The top chunk is drawn collapsed because it is usually most of the heap and says nothing. '
       + 'Scale: <button class="pill" id="scale" style="min-width:auto;height:auto;padding:1px 8px">' + SCALE + "</button></div></div>";
}

function renderSide(snap) {
  const bins = Object.keys(snap.tcache).map(Number).sort((a, b) => a - b);
  let tcg = "";
  if (bins.length) {
    // Floor the divisor at 1: a bin can exist with count 0, and dividing by
    // the maximum would then be 0/0 and render as width:NaN%.
    const maxCount = Math.max(1, ...bins.map(i => snap.tcache[i].count));
    for (const i of bins) {
      const b = snap.tcache[i];
      const pct = Math.round(b.count / maxCount * 100);
      tcg += '<div class="faint">[' + i + "]</div><div>" + esc(b.size) + "</div>"
          +  '<div class="tbar"><i style="width:' + pct + '%"></i></div>'
          +  '<div style="text-align:right;color:#791F1F">' + b.count + "</div>";
    }
  } else {
    tcg = '<div class="faint" style="grid-column:1/-1">all bins empty</div>';
  }

  const unsorted = snap.chunks.find(c => c.state === "unsorted");
  let uns = '<div class="faint">no chunk in the unsorted bin</div>';
  if (unsorted) {
    uns = "<div>fd = " + esc(unsorted.fd) + "</div><div>bk = " + esc(unsorted.bk) + "</div>";
    const off = snap.offsets.unsorted_bin, base = snap.libc_base;
    if (off && base) {
      const expect = num(base) + num(off);
      uns += '<div class="faint">libc + ' + esc(off) + " = " + "0x" + expect.toString(16) + "</div>";
      uns += '<div class="faint">fd - that = ' + "0x" + (num(unsorted.fd) - expect).toString(16) + "</div>";
    }
  }

  // Findings come from heapscope.describe, the same module the terminal UI
  // uses. Nothing about what counts as anomalous is decided here.
  const LEVEL = {
    warn: { bg: "#FAEEDA", edge: "#EF9F27", fg: "#633806" },
    info: { bg: "#E6F1FB", edge: "#85B7EB", fg: "#0C447C" }
  };
  const chips = (snap.findings || []).map(f => {
    const pal = LEVEL[f.level] || LEVEL.info;
    return '<span class="chip" style="background:' + pal.bg + ";border:0.5px solid "
         + pal.edge + ";color:" + pal.fg + '">' + esc(f.scope) + " " + esc(f.message) + "</span>";
  });
  if (!chips.length) chips.push('<span class="faint">nothing anomalous</span>');

  return '<div class="panel"><h2>tcache</h2><div class="tcg">' + tcg + "</div>"
       + '<h2 style="margin-top:20px">unsorted bin</h2><div class="kv">' + uns + "</div>"
       + '<h2 style="margin-top:20px">flags</h2><div>' + chips.join("") + "</div></div>";
}

function renderDiff(snap, prev, diff) {
  if (!diff) {
    return '<div class="panel diff"><h2>diff</h2><div class="faint">This is the first snapshot, so there is nothing to compare against. '
         + "Step forward to see what a stage changed.</div></div>";
  }
  let rows = "";
  if (diff.added.length) rows += '<div style="color:#085041">+' + diff.added.length + " chunk</div><div>" + diff.added.map(esc).join(", ") + "</div>";
  if (diff.removed.length) rows += '<div style="color:#791F1F">-' + diff.removed.length + " chunk</div><div>" + diff.removed.map(esc).join(", ") + "</div>";
  for (const [addr, before, after] of diff.changed) {
    rows += '<div style="color:#633806">~changed</div><div>' + esc(addr) + " &nbsp;" + esc(before) + " &rarr; " + esc(after) + "</div>";
  }
  for (const i of diff.tcache_changed) {
    const b = diff.tcache_before[i] || [0, null], a = diff.tcache_after[i] || [0, null];
    rows += '<div style="color:#791F1F">tcache[' + i + "]</div><div>count " + b[0] + " &rarr; " + a[0]
         +  " &nbsp; head " + esc(show(b[1])) + " &rarr; " + esc(show(a[1])) + "</div>";
  }
  if (!rows) rows = '<div class="faint" style="grid-column:1/-1">Nothing changed between these two snapshots.</div>';

  return '<div class="panel diff"><h2>diff: ' + esc(prev.label) + " &rarr; " + esc(snap.label) + "</h2>"
       + '<div class="dgrid">' + rows + "</div></div>";
}

function render() {
  const snaps = DATA.snapshots, snap = snaps[INDEX], diff = DATA.diffs[INDEX];
  document.getElementById("meta").innerHTML =
    (snap.pid ? "<span>pid " + snap.pid + "</span>" : "")
    + (snap.glibc ? "<span>glibc " + esc(snap.glibc) + "</span>" : "")
    + "<span>" + snaps.length + " snapshots</span>";

  document.getElementById("scrub").innerHTML =
    '<span class="muted" style="font-size:12px;margin-right:3px">snapshot</span>'
    + snaps.map((s, i) => '<button class="pill' + (i === INDEX ? " on" : "") + '" data-i="' + i + '">' + (i + 1) + "</button>").join("")
    + '<span class="faint" style="font-size:12px;margin-left:9px">' + esc(snap.label) + "</span>";

  document.getElementById("scrub").querySelectorAll(".pill").forEach(el => {
    el.addEventListener("click", () => { INDEX = Number(el.dataset.i); render(); });
  });

  document.getElementById("body").innerHTML =
    '<div class="cols"><div>' + renderMap(snap, diff) + "</div><div>" + renderSide(snap) + "</div></div>"
    + renderDiff(snap, snaps[INDEX - 1], diff);

  const sc = document.getElementById("scale");
  if (sc) sc.addEventListener("click", () => { SCALE = SCALE === "linear" ? "sqrt" : "linear"; render(); });
}

document.addEventListener("keydown", e => {
  if (!DATA) return;
  if (e.key === "ArrowRight" && INDEX < DATA.snapshots.length - 1) { INDEX++; render(); }
  if (e.key === "ArrowLeft" && INDEX > 0) { INDEX--; render(); }
});

fetch("/api/snapshots").then(r => r.json()).then(d => {
  DATA = d;
  if (!d.snapshots.length) {
    document.getElementById("body").innerHTML =
      '<div class="panel empty">No snapshots loaded.<br><br>Dump one at each stage from your exploit script:<br><br>'
      + '<code>HeapSnapshot.capture(p, label="after free(0)").save("stages/03.json")</code><br><br>'
      + "then serve the directory:<br><br><code>heapscope view stages/</code></div>";
    return;
  }
  INDEX = d.snapshots.length - 1;
  render();
}).catch(err => {
  document.getElementById("body").innerHTML = '<div class="panel empty">Could not load snapshots: ' + esc(err) + "</div>";
});
</script>
